<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>የኔ ጓደኛ (Bro AI) — My Best Friend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ---------- Base & Reset ---------- */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg-0: #0f1320;
    --bg-1: #161b2e;
    --bg-2: #1d233a;
    --surface: rgba(255, 255, 255, 0.04);
    --surface-2: rgba(255, 255, 255, 0.08);
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.16);
    --text: #e9ecf3;
    --text-dim: #a4abc1;
    --text-mute: #6c7493;
    --accent: #5b8def;
    --accent-2: #6aa3ff;
    --accent-glow: rgba(91, 141, 239, 0.45);
    --user-bubble: linear-gradient(135deg, #3a76f0 0%, #5b8def 100%);
    --friend-bubble: linear-gradient(135deg, #232a44 0%, #1b2138 100%);
    --success: #34d399;
    --danger: #ef4444;
    --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.45);
    --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.35);
    --radius-sm: 10px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --radius-pill: 999px;
  }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Noto Sans Ethiopic', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--text);
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(91, 141, 239, 0.18), transparent 60%),
      radial-gradient(1000px 500px at 110% 110%, rgba(124, 58, 237, 0.18), transparent 60%),
      linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    line-height: 1.55;
  }

  /* ---------- App Shell ---------- */
  .app {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    max-width: 920px; margin: 0 auto;
    background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.005));
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
    backdrop-filter: blur(8px);
  }
  @media (max-width: 600px) {
    .app { border: none; }
  }

  /* ---------- Header ---------- */
  .header {
    position: relative;
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px;
    background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
    border-bottom: 1px solid var(--border);
    z-index: 5;
  }
  .header::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--border-strong), transparent);
  }
  .avatar {
    position: relative;
    width: 42px; height: 42px;
    border-radius: 50%;
    background: linear-gradient(135deg, #5b8def 0%, #7c3aed 100%);
    display: grid; place-items: center;
    font-size: 22px;
    box-shadow: 0 4px 14px rgba(91, 141, 239, 0.4);
    flex-shrink: 0;
  }
  .avatar::after {
    content: ""; position: absolute; right: -2px; bottom: -2px;
    width: 13px; height: 13px;
    background: var(--success);
    border: 2.5px solid var(--bg-1);
    border-radius: 50%;
    box-shadow: 0 0 0 2px rgba(52, 211, 153, 0.2);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 2px rgba(52, 211, 153, 0.2); }
    50% { box-shadow: 0 0 0 5px rgba(52, 211, 153, 0.05); }
  }
  .title-wrap { flex: 1; min-width: 0; }
  .title {
    font-size: 16px; font-weight: 600; letter-spacing: -0.01em;
    color: var(--text);
  }
  .subtitle {
    font-size: 12px; color: var(--text-dim);
    display: flex; align-items: center; gap: 5px;
  }
  .subtitle .dot {
    width: 6px; height: 6px; background: var(--success); border-radius: 50%;
    box-shadow: 0 0 6px var(--success);
  }
  .icon-btn {
    width: 40px; height: 40px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 12px;
    display: grid; place-items: center;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .icon-btn:hover {
    background: var(--surface-2);
    border-color: var(--border-strong);
    transform: translateY(-1px);
  }
  .icon-btn svg { width: 18px; height: 18px; }

  /* ---------- Chat Area ---------- */
  .chat {
    flex: 1; overflow-y: auto;
    padding: 20px 14px 12px;
    scroll-behavior: smooth;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.12) transparent;
  }
  .chat::-webkit-scrollbar { width: 6px; }
  .chat::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.12);
    border-radius: 999px;
  }

  .date-divider {
    text-align: center;
    margin: 6px 0 14px;
  }
  .date-divider span {
    display: inline-block;
    padding: 4px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    font-size: 11px;
    color: var(--text-dim);
  }

  .msg-row {
    display: flex; gap: 8px;
    margin-bottom: 10px;
    animation: msgIn 0.35s cubic-bezier(0.2, 0.7, 0.3, 1.2);
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg-row.friend { justify-content: flex-start; }
  .msg-row.user { justify-content: flex-end; }

  .msg-avatar {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: linear-gradient(135deg, #5b8def, #7c3aed);
    display: grid; place-items: center;
    font-size: 14px;
    flex-shrink: 0;
    align-self: flex-end;
  }
  .msg-avatar.user-avatar {
    background: linear-gradient(135deg, #34d399, #10b981);
    font-weight: 600;
  }
  .bubble {
    max-width: min(80%, 520px);
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.55;
    position: relative;
    word-wrap: break-word;
    white-space: pre-wrap;
    box-shadow: var(--shadow-md);
  }
  .friend .bubble {
    background: var(--friend-bubble);
    color: var(--text);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .user .bubble {
    background: var(--user-bubble);
    color: #fff;
    border-bottom-right-radius: 4px;
    box-shadow: 0 6px 18px var(--accent-glow);
  }
  .meta {
    font-size: 10px;
    color: var(--text-mute);
    margin-top: 4px;
    text-align: right;
  }
  .user .meta { color: rgba(255,255,255,0.7); }

  /* ---------- Typing Indicator ---------- */
  .typing {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 2px;
  }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--text-dim);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  /* ---------- Input Area ---------- */
  .composer {
    padding: 12px 14px 16px;
    background: linear-gradient(180deg, transparent, rgba(0,0,0,0.25));
    border-top: 1px solid var(--border);
  }
  .composer-inner {
    display: flex; align-items: flex-end; gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 6px 6px 6px 14px;
  }
  .composer-inner:focus-within {
    border-color: var(--border-strong);
    background: var(--surface-2);
  }
  .composer textarea {
    flex: 1; min-height: 24px; max-height: 140px;
    background: transparent;
    border: none; outline: none; resize: none;
    color: var(--text);
    font-family: inherit; font-size: 15px;
    line-height: 1.5;
    padding: 8px 0;
  }
  .send-btn {
    width: 40px; height: 40px;
    border: none; outline: none;
    background: linear-gradient(135deg, #3a76f0, #5b8def);
    color: #fff;
    border-radius: 12px;
    display: grid; place-items: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.2s ease;
  }
  .send-btn:disabled {
    opacity: 0.5; cursor: not-allowed;
    background: var(--surface-2);
  }
  .send-btn svg { width: 18px; height: 18px; }

  /* ---------- Modal Backdrop & Popups ---------- */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(8, 10, 20, 0.75);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center; justify-content: center;
    z-index: 100;
    padding: 16px;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    width: 100%; max-width: 440px;
    background: linear-gradient(180deg, #1d233a, #161b2e);
    border: 1px solid var(--border-strong);
    border-radius: 18px;
    box-shadow: var(--shadow-lg);
    padding: 22px;
  }
  .modal h2 { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
  .field { margin-bottom: 14px; text-align: left; }
  .field label, .field .step {
    display: block; font-size: 12px; font-weight: 500;
    color: var(--text-dim); margin-bottom: 6px;
  }
  .input-wrap {
    background: var(--bg-0);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: flex;
  }
  .field input, .field textarea {
    width: 100%; background: transparent; border: none; outline: none;
    color: var(--text); font-family: inherit; font-size: 14px; padding: 12px 14px;
  }
  .btn {
    padding: 10px 18px; border-radius: 10px; font-family: inherit; font-size: 14px;
    border: 1px solid transparent; cursor: pointer;
  }
  .btn.secondary { background: var(--surface); color: var(--text); border-color: var(--border); }
  .btn.primary { background: linear-gradient(135deg, #3a76f0, #5b8def); color: #fff; width: 100%; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }

  /* ---------- Welcome State ---------- */
  .welcome { text-align: center; padding: 30px 20px; color: var(--text-dim); }
  .welcome .big {
    font-size: 32px; font-weight: 700; margin-bottom: 6px;
    background: linear-gradient(135deg, #5b8def, #7c3aed);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }

  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: 90px;
    transform: translateX(-50%) translateY(20px);
    background: rgba(20, 25, 45, 0.95);
    border: 1px solid var(--border-strong);
    color: var(--text); padding: 10px 16px; border-radius: var(--radius-pill);
    font-size: 13.5px; opacity: 0; pointer-events: none; z-index: 200;
    transition: all 0.3s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="avatar">🤝</div>
      <div class="title-wrap">
        <div class="title">የኔ ጓደኛ (Bro AI)</div>
        <div class="subtitle"><span class="dot"></span><span id="statusText">እያወራ ነው · online</span></div>
      </div>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83-2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <!-- Chat -->
    <main class="chat" id="chat">
      <div class="date-divider"><span>ዛሬ · Today</span></div>
      <div class="welcome" id="welcome">
        <div class="big">ሰላም ብሮ 👋</div>
        <div>እኔ ጓደኛህ ነኝ — ንገረኝ ምን ነው አለን?</div>
      </div>
    </main>

    <!-- Composer -->
    <div class="composer">
      <div class="composer-inner">
        <textarea id="input" rows="1" placeholder="መልዕክት ጻፍ… (Enter to send)"></textarea>
        <button class="send-btn" id="sendBtn" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Onboarding Modal (Only asks for Name) -->
  <div class="modal-backdrop" id="welcomeModal">
    <div class="modal" role="dialog">
      <h2>ሰላም ብሮ! 👋 እንተዋወር</h2>
      <p style="color: var(--text-dim); font-size: 13px; margin: 6px 0 16px;">ከመጀመሪያ ስምህን ንገረኝ — እንድታውቅህ።</p>
      <div class="field">
        <div class="step">① ስምህ / Your name *</div>
        <div class="input-wrap">
          <input id="userName" type="text" placeholder="ለምሳሌ፡ አበበ" maxlength="40" />
        </div>
      </div>
      <div class="field">
        <div class="step">② ራስህን አስተዋውቅ (optional)</div>
        <div class="input-wrap">
          <textarea id="userIntro" rows="2" placeholder="ስለ ራስህ ትንሽ ንገረኝ…"></textarea>
        </div>
      </div>
      <div class="modal-actions" style="justify-content: center;">
        <button class="btn primary" id="welcomeSave" type="button">ጀምር · Get Started →</button>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-backdrop" id="modal">
    <div class="modal" role="dialog">
      <h2>⚙️ Settings · ቅንብር</h2>
      <div class="field" style="margin-top: 14px;">
        <label for="userNameSettings">ስምህ / Your name</label>
        <div class="input-wrap">
          <input id="userNameSettings" type="text" placeholder="ስምህን አስተካክል" />
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn secondary" id="clearBtn" type="button">Clear Chat</button>
        <button class="btn secondary" id="closeSettingsBtn" type="button">Cancel</button>
        <button class="btn primary" id="saveBtn" type="button" style="width: auto;">Save</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
(() => {
  const LS_NAME = "broai.userName";
  const LS_INTRO = "broai.userIntro";
  const LS_HIST = "broai.history";

  const SYSTEM_PROMPT = `You are "የኔ ጓደኛ" (My Best Friend Bro AI) — a close Ethiopian best friend to the user. \
You speak naturally in Amharic and Amharlish (አማርሊሽ), blending casual Addis Ababa street slang.
- You are witty, funny, supportive, chill — like a true homie who has the user's back.
- You casually use words like: አቦ, ብሮ, ተወው እስቲ, እንዴ, ምን ነው አለን, አይደለም አቦ, ይቅርታ, ቻ, እሺ ጓደኛ, አለህ? naturally.
- Keep replies conversational — usually 1-3 sentences.`;

  const $ = (id) => document.getElementById(id);
  const chatEl = $("chat");
  const inputEl = $("input");
  const sendBtn = $("sendBtn");
  const settingsBtn = $("settingsBtn");
  const modal = $("modal");
  const saveBtn = $("saveBtn");
  const clearBtn = $("clearBtn");
  const closeSettingsBtn = $("closeSettingsBtn");
  const toastEl = $("toast");
  const welcomeEl = $("welcome");
  const statusText = $("statusText");
  const welcomeModal = $("welcomeModal");
  const userNameEl = $("userName");
  const userIntroEl = $("userIntro");
  const welcomeSaveBtn = $("welcomeSave");
  const userNameSettingsEl = $("userNameSettings");

  let userName = localStorage.getItem(LS_NAME) || "";
  let userIntro = localStorage.getItem(LS_INTRO) || "";
  let history = loadHistory();
  let busy = false;
  let typingEl = null;

  function loadHistory() {
    try {
      const raw = localStorage.getItem(LS_HIST);
      return raw ? JSON.parse(raw) : [];
    } catch { return []; }
  }

  function saveHistory() {
    try { localStorage.setItem(LS_HIST, JSON.stringify(history.slice(-20))); } catch {}
  }

  function buildSystemPrompt() {
    const nameLine = userName ? `The user's name is: ${userName}. Use their name naturally.` : "";
    const introLine = userIntro ? `About user: """${userIntro}""".` : "";
    return `${SYSTEM_PROMPT}\n${nameLine}\n${introLine}`.trim();
  }

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.className = "toast show";
    setTimeout(() => { toastEl.className = "toast"; }, 3000);
  }

  function scrollToBottom() {
    requestAnimationFrame(() => { chatEl.scrollTop = chatEl.scrollHeight; });
  }

  function renderAll() {
    chatEl.querySelectorAll(".msg-row").forEach(n => n.remove());
    welcomeEl.style.display = history.length === 0 ? "" : "none";
    history.forEach(m => addBubble(m.role, m.content, false));
    scrollToBottom();
  }

  function addBubble(role, content, animate = true) {
    const row = document.createElement("div");
    row.className = "msg-row " + (role === "user" ? "user" : "friend");
    if (!animate) row.style.animation = "none";
    const avatar = document.createElement("div");
    avatar.className = "msg-avatar " + (role === "user" ? "user-avatar" : "");
    avatar.textContent = role === "user" ? "አንተ" : "🤝";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = content;
    row.appendChild(avatar);
    row.appendChild(bubble);
    chatEl.appendChild(row);
    if (animate) scrollToBottom();
  }

  function showTyping() {
    if (typingEl) return;
    typingEl = document.createElement("div");
    typingEl.className = "msg-row friend";
    typingEl.innerHTML = `<div class="msg-avatar">🤝</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
    chatEl.appendChild(typingEl);
    scrollToBottom();
  }

  function hideTyping() {
    if (typingEl) { typingEl.remove(); typingEl = null; }
  }

  // Settings Handlers
  settingsBtn.addEventListener("click", () => {
    userNameSettingsEl.value = userName;
    modal.classList.add("open");
  });
  closeSettingsBtn.addEventListener("click", () => modal.classList.remove("open"));
  saveBtn.addEventListener("click", () => {
    const newName = userNameSettingsEl.value.trim();
    if (newName) {
      localStorage.setItem(LS_NAME, newName);
      userName = newName;
    }
    modal.classList.remove("open");
    showToast("ስምህ ተቀይሯል");
  });
  clearBtn.addEventListener("click", () => {
    if (!confirm("ውይይቱን ላጥፋው?")) return;
    history = [];
    saveHistory();
    renderAll();
    modal.classList.remove("open");
  });

  // Welcome Handlers
  welcomeSaveBtn.addEventListener("click", async () => {
    const name = userNameEl.value.trim();
    const intro = userIntroEl.value.trim();
    if (!name) { alert("እባክህ ስምህን አስገባ"); return; }
    localStorage.setItem(LS_NAME, name);
    localStorage.setItem(LS_INTRO, intro);
    userName = name;
    userIntro = intro;
    welcomeModal.classList.remove("open");
    await sendMessage(`ሰላም! ስሜ ${name} ነው።`);
  });

  // Call Serverless Backend
  async function callBackend(systemText, messages) {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ systemText, messages })
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || `HTTP ${res.status}`);
    }

    const data = await res.json();
    return data?.candidates?.[0]?.content?.parts?.[0]?.text || "መልስ ማግኘት አልተቻለም";
  }

  async function sendMessage(text) {
    if (!text || busy) return;
    history.push({ role: "user", content: text });
    addBubble("user", text);
    saveHistory();
    welcomeEl.style.display = "none";

    busy = true;
    sendBtn.disabled = true;
    statusText.textContent = "እየተዋወረ ነው…";
    showTyping();

    try {
      const recent = history.slice(-15);
      const sysText = buildSystemPrompt();
      const reply = await callBackend(sysText, recent);
      hideTyping();
      history.push({ role: "assistant", content: reply });
      addBubble("friend", reply);
      saveHistory();
      statusText.textContent = "እያወራ ነው · online";
    } catch (e) {
      hideTyping();
      addBubble("friend", "⚠️ ችግር አጋጥሟል፦ ሰርቨሩ አልመለሰም። እባክህ Vercel Environment Variables ላይ GEMINI_API_KEY መመዝገቡን አረጋግጥ።");
      statusText.textContent = "error";
    } finally {
      busy = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener("click", () => {
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = "";
    sendMessage(text);
  });

  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendBtn.click();
    }
  });

  function init() {
    renderAll();
    if (!userName) {
      welcomeModal.classList.add("open");
    }
  }
  init();
})();
</script>
</body>
</html>
